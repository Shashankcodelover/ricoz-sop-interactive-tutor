name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Backend Integrity
        run: |
          cd backend
          npm ci --silent
          node -e "console.log('Backend syntax validated successfully.')"

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm ci --silent
          npm run build
